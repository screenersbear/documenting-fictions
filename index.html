<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Documenting Fictions</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FAFAF7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- Kept as it was: changing it on the installed app means installing it again, which loses its data. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Documenting Fictions" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-512.png" />

<script>
/* Launched while a notebook was open, the app goes straight back into it,
   before the shelf draws. Coming back from a notebook (?from) or with the
   browser's back button, the shelf stays. */
(function () {
  try {
    var inside = localStorage.getItem('df-suite-in');
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    var back = nav && nav.type === 'back_forward';
    if (inside && !back && !/[?&]from=/.test(location.search) && /^(ref|the-eye|contact-sheet|overthoughts)$/.test(inside)) {
      document.documentElement.style.visibility = 'hidden';
      location.replace(inside + '/');
    }
    // Coming back from a notebook, the book shuts into the shelf: the bar
    // under it stays hidden from the first paint until it has (app.js).
    var still = /[?&]still/.test(location.search) || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (/[?&]from=/.test(location.search) && !still) document.documentElement.classList.add('arriving');
  } catch (e) {}
})();
</script>
<!-- How it looks: the stylesheets in styles/, joined in order into one file (files.txt lists them). -->
<link rel="stylesheet" href="built/app.css" />
</head>
<body>
<main class="shelf" id="shelf" aria-label="Your notebooks">
  <h1 class="shelf-title">Documenting Fictions</h1>
  <div class="stage" id="stage"></div>
  <!-- Under the books (pages/shelf-caption.js): the name of the one in front, a line about it, a dot for each,
       and Options, which brings it up close with its colour, its stickers (components/stickers.js) and Back up all four (components/backup-sheet.js). -->
  <div class="shelf-bar" id="shelfBar">
    <p class="front-name" id="frontName"></p>
    <p class="front-line" id="frontLine"></p>
    <div class="front-dots" id="frontDots" aria-hidden="true"></div>
    <button type="button" class="opts-disc" id="optionsBtn"></button>
  </div>
</main>
<!-- What it does: the scripts listed in files.txt, joined in order into one file. -->
<script src="built/app.js"></script>
</body>
</html>
