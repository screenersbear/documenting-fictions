<!DOCTYPE html>
<html lang="en" data-book="berry">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Layouts</title>
<meta name="description" content="Build Instagram carousels and Stories from your photos, with photos that run across slides." />

<!-- Inside Documenting Fictions this says so (the suite's own file); copied out on its own the notebook has no ../suite.js and is an app of its own. -->
<script src="../suite.js"></script>
<!-- What the notebooks share, window.DFData: the suite's shared/data/, copied into data/shared/ and joined in order into one file (files.txt lists them). -->
<script src="built/shared-data.js"></script>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f3f3f3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Layouts" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<script>try { var book = localStorage.getItem('contact-sheet-book'); if (book) document.documentElement.dataset.book = book; } catch (e) {}</script>
<script src="components/upright.js"></script>
<link rel="preload" href="fonts/klee-one-latin.woff" as="font" type="font/woff" crossorigin />
<link rel="preload" href="fonts/kaisei-decol-500-latin.woff2" as="font" type="font/woff2" crossorigin />
<!-- How it looks: the stylesheets in styles/, joined in order into one file (files.txt lists them). -->
<link rel="stylesheet" href="built/app.css" />
</head>
<!-- data-route="book" from the start: the book (or the editor, just as wide) is always the first screen, so the page doesn't open as a narrow column and jump wide once the script runs. -->
<body data-route="book">

<div id="app">
  <main id="view" class="view" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript><p class="noscript">Layouts needs JavaScript turned on.</p></noscript>
<!-- The scripts: app.js and every module it imports, joined into one file (files.txt says how). -->
<script type="module" src="built/app.js"></script>
</body>
</html>
