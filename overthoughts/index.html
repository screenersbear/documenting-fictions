<!DOCTYPE html>
<html lang="en" data-book="leaf">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Overthoughts</title>
<meta name="description" content="A notebook for thinking things over: your own entries and monthly reviews." />
<!-- Inside Documenting Fictions this says so (the suite's own file); copied out on its own the notebook has no ../suite.js and is an app of its own. -->
<script src="../suite.js"></script>
<!-- What the notebooks share, window.DFData (copied in from the suite's shared/data/). -->
<script src="data/shared/basics.js"></script>
<script src="data/shared/files.js"></script>
<script src="data/shared/overthoughts.js"></script>
<script src="data/shared/the-eye.js"></script>
<script src="data/shared/journal-move.js"></script>
<script src="data/shared/json-backup.js"></script>
<script src="data/shared/zip-format.js"></script>
<script src="data/shared/zip-backup.js"></script>
<script src="data/shared/zip-restore.js"></script>
<script src="data/shared/links.js"></script>
<script src="data/shared/df-data.js"></script>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Overthoughts" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="preload" href="fonts/kaisei-decol-500-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<script>try { var book = localStorage.getItem('overthoughts-book'); if (book) document.documentElement.dataset.book = book; } catch (e) {}</script>
<!-- The look, in the order it applies: the basics first, the header band last. -->
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/spread.css" />
<link rel="stylesheet" href="styles/cover.css" />
<link rel="stylesheet" href="styles/screen.css" />
<link rel="stylesheet" href="styles/navbar.css" />
<link rel="stylesheet" href="styles/lists.css" />
<link rel="stylesheet" href="styles/forms.css" />
<link rel="stylesheet" href="styles/sheet.css" />
<link rel="stylesheet" href="styles/toast.css" />
<link rel="stylesheet" href="styles/entries.css" />
<link rel="stylesheet" href="styles/entry.css" />
<link rel="stylesheet" href="styles/review.css" />
<link rel="stylesheet" href="styles/header-band.css" />
</head>
<body>
<div id="frame" class="frame" data-side="left">
  <div class="paper"><main id="view" tabindex="-1"></main></div>
</div>
<div class="pull" id="pull" aria-hidden="true" hidden></div>
<nav class="nav-bar" id="navbar" aria-label="Sections" hidden></nav>
<div class="nb closed no-anim" id="book">
  <div class="nb-ground"></div>
  <div class="nb-float"><div class="nb-turn">
    <div class="nb-book">
      <div class="nb-stack" id="bookStack"></div>
      <div class="nb-side-tabs" id="bookSideTabs"><i class="y" style="--top:15%;--h:33.5%;--i:3"><span>Entries</span></i><i class="n" style="--top:50%;--h:33.8%;--i:7"><span>Reviews</span></i></div>
      <div class="nb-spine3d"></div>
      <div class="nb-block"><span class="nb-title" id="titleR"></span></div>
      <div class="nb-leaf">
        <div class="nb-front"></div>
        <div class="nb-inside"><span class="nb-title" id="titleL"></span></div>
      </div>
    </div>
  </div></div>
  <button type="button" class="nb-hit" id="bookHit" aria-label="Open the notebook"></button>
  <button type="button" class="nb-sun" id="bookSun" aria-label="App options"></button>
  <div id="bookTabHits">
    <button type="button" class="nb-hit-tab" data-go="#/entries" aria-label="Open at Entries"></button>
    <button type="button" class="nb-hit-tab" data-go="#/reviews" aria-label="Open at Reviews"></button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p>This app needs JavaScript turned on.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
