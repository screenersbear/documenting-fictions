<script>try { var appColor = localStorage.getItem('df-app-color'); if (appColor) document.documentElement.dataset.book = appColor; } catch (e) {}</script>
<script>
/* Held upright (user, 11-11): installed on a phone and turned sideways, the
   page turns itself back so it stays the way up the phone is. Decided here,
   before anything draws, and again on every resize before the app's own
   listeners run. styles/notebook-shoot-mode.css (:root.nb-turned) and components/held-upright.js (setupTurnShim). */
(function () {
  var d = document.documentElement;
  function turn() {
    var on = false, a = 0;
    try {
      on = (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches)
        && Math.min(screen.width, screen.height) < 600 && matchMedia('(orientation: landscape)').matches;
      a = typeof window.orientation === 'number' ? window.orientation : (screen.orientation ? screen.orientation.angle : 90);
    } catch (e) { on = false; }
    if (on) {
      var w = Math.min(screen.width, screen.height), h = Math.max(screen.width, screen.height);
      d.dataset.turn = (a === -90 || a === 270) ? '-90' : '90';
      d.style.setProperty('--turn-w', w + 'px');
      d.style.setProperty('--turn-h', h + 'px');
      try {
        var sa = JSON.parse(localStorage.getItem('df_safe_areas') || 'null');
        if (sa && sa.top >= 0 && sa.bottom >= 0) { d.style.setProperty('--turn-sa-top', sa.top + 'px'); d.style.setProperty('--turn-sa-bottom', sa.bottom + 'px'); }
      } catch (e) {}
      d.classList.add('nb-turned');
    } else if (d.classList.contains('nb-turned')) {
      d.classList.remove('nb-turned');
      delete d.dataset.turn;
    }
  }
  window.__dfTurn = turn;
  turn();
  window.addEventListener('resize', turn);
  window.addEventListener('orientationchange', function () { turn(); setTimeout(turn, 300); });
})();
</script>
<!-- How it looks: the stylesheets in styles/, joined in order into one file (files.txt lists them). -->
<link rel="stylesheet" href="built/app.css" />
</head>

<!-- The screens and popups: their markup is in pages/ and components/ (files.txt lists the pieces in order), joined into built/markup.js, which puts it here.

     The PDF maker (lib/jspdf.umd.min.js) isn't loaded here: components/load-lib.js loads it the first time a PDF is made. -->

<script defer src="built/app.js"></script>
</body>
